<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2d6a4f">
<title>工作日誌</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f3ef;--card:#fff;--ink:#1f2622;--muted:#66706a;--line:#d9ddd5;--accent:#2d6a4f;--accent-soft:#e1efe7;--warn:#a15c00;--warn-soft:#fff1d9;--cal:#2f5fa7;--cal-soft:#e4ecf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 120px}
h2{font-size:14px;color:var(--muted);margin:18px 0 6px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.add{border-style:dashed;color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,textarea{font:inherit;font-size:18px;color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%;min-width:0}
input.num{width:64px;text-align:center}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.cal{background:var(--cal-soft);border-color:var(--cal-soft);color:var(--cal);font-weight:700}
button.sm{padding:4px 10px;font-size:14px;border-radius:8px}
button.link{border:0;background:none;color:var(--accent);padding:2px 0;font-size:14px}
.prev{font-size:17px;font-weight:700;background:var(--accent-soft);border-radius:10px;padding:10px 12px;border:0;resize:vertical}
.go{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.entry.ok{opacity:.7}
.entry .t{font-size:15px;word-break:break-all}
.entry .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
/* 視窗裡的東西不要被壓扁，太長就往下捲 */
.sheet .box > *{flex-shrink:0}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.warn b{color:var(--warn)} .tile.ok b{color:var(--accent)}
.entry.old{border-color:#e0a7a0;background:#fdf3f1}
.again{display:flex;flex-direction:column;gap:6px}
.again button{text-align:left;font-size:14px;padding:9px 12px;background:var(--card)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin:18px 0 6px}
.entry.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.entry .ckb{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:inline-grid;place-items:center;margin-right:8px;vertical-align:middle;font-size:15px;color:#fff;background:#fff}
.entry.sel .ckb{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.selbar[hidden]{display:none}
button.del{background:#b0392b;border-color:#b0392b;color:#fff;font-weight:700}
.entry .when{font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.entry .when:empty{display:none}
.dayh{font-size:17px;color:var(--ink);font-weight:900}
.filters{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.filters .chips .chip{font-size:14px;padding:4px 11px}
.tile{cursor:pointer}
.ppl{display:flex;flex-direction:column;gap:4px;font-size:15px;background:var(--bg);border-radius:10px;padding:6px 10px}
.pp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{color:var(--accent);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:14px}
.bigEd{position:fixed;inset:0;z-index:40;background:var(--card);display:flex;flex-direction:column}
.bigEd[hidden]{display:none}
.bigEd .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.bigEd .bar b{flex:1;font-size:17px}
.bigEd .bar button{font-size:17px;padding:10px 16px}
.bigEd textarea{flex:1;border:0;border-radius:0;font-size:22px;line-height:1.7;padding:14px 16px;resize:none;background:var(--card)}
textarea.big{cursor:text}
.tapedit{font-size:13px;color:var(--muted);margin-top:-4px}
.tour{position:fixed;inset:0;z-index:60}
.tour[hidden]{display:none}
.tour .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(15,20,18,.62);outline:3px solid #ffd76a;transition:all .25s;pointer-events:none}
.tour .tip{position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.tour .tip h4{margin:0;font-size:20px}
.tour .tip p{margin:0;font-size:17px;line-height:1.6}
.tour .tip .row button{font-size:17px;padding:11px 16px}
.tour .dots{display:flex;gap:5px}
.tour .dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.tour .dots i.on{background:var(--accent)}
@media (prefers-reduced-motion: reduce){.tour .hole{transition:none}}
.backbtn{font-size:17px;padding:10px 16px;border-radius:12px;font-weight:700}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.abar[hidden]{display:none}
.abar button{font-size:17px;padding:13px 6px;border-radius:12px;font-weight:700}
details.tools{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
details.tools summary{margin:4px 0;color:var(--ink);font-size:15px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;font-size:19px;padding:14px 34px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.intro .ex{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-weight:700}
.caseV{position:fixed;inset:0;z-index:14;background:var(--bg);display:flex;flex-direction:column}
.caseV[hidden]{display:none}
.caseV .top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
.caseV .body > *{flex-shrink:0}
.caseV .body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:720px;width:100%;margin:0 auto}
.cs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.cs .tt{font-size:17px;font-weight:900}
.pbar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.stp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.stp.done{opacity:.65}
.stp .ck{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:20px;color:#fff;padding:0}
.stp.done .ck{background:var(--accent);border-color:var(--accent)}
.casechip{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 8px;border:0;cursor:pointer;align-self:flex-start}
.comp{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
.comp[hidden]{display:none}
.comp .top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px calc(10px);display:flex;flex-direction:column;gap:8px}
.comp .bar{display:flex;align-items:center;gap:8px}
.comp .steps{display:flex;gap:4px;flex:1}
.comp .steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.comp .steps i.on{background:var(--accent)}
/* 記一筆每一頁的內容不要被壓扁（最後一步的「這一行」原本會被吃掉），太長就往下捲 */
.comp .body > *{flex-shrink:0}
.comp .body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
.comp .q{font-size:20px;font-weight:900}
.comp .foot{background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.comp .foot button{flex:1;padding:13px;font-size:17px}
.comp .chip{font-size:17px;padding:8px 15px}
.live{font-size:15px;font-weight:700;color:var(--accent);min-height:1.5em}
.live.empty{color:var(--muted);font-weight:400}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>📝 工作日誌</h1><span class="hint" title="版本">v19・11/13</span><span style="flex:1"></span><button class="sm" id="bSet">⚙ 設定</button></header>
<div class="wrap">
  <div id="dash"></div>
  <div id="pending"></div>
  <div id="cases"></div>
  <div id="days"></div>
  <div id="again"></div>
</div>
<div class="abar" id="abar"><button id="bPaste">📋 貼上</button><button class="pri" id="bNew">＋ 記一筆</button><button id="bCase2">📁 開案子</button></div>
<div class="tour" id="tour" hidden><div class="hole" id="tourHole"></div><div class="tip" id="tourTip"></div></div>
<div class="selbar" id="selbar" hidden><span id="selN" style="flex:1">已選 0 筆</span><button id="selCancel">取消</button><button class="del" id="selDel" disabled>🗑 刪除</button></div>
<div class="caseV" id="caseV" hidden></div>
<div class="comp" id="builder" hidden></div>
<div class="bigEd" id="bigEd" hidden><div class="bar"><button id="beX">取消</button><b id="beT"></b><button class="pri" id="beOk">✓ 好了</button></div><textarea id="beTa"></textarea></div>
<div class="sheet" id="sheet" hidden><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const md = s => { const [, m, d] = s.split('-'); return `${+m}/${+d}`; };
const wd = s => '日一二三四五六'[new Date(s + 'T00:00').getDay()];
const today = () => iso(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2400); }

// 選項：照他以前日曆上的寫法整理；點過的會排到前面，也可以自己加
const DEF = {
  prefix: '新店機廠站', me: '毅', email: '',
  places: ['管委會', '地下空車位', '空屋'],
  items: ['電子鎖', '馬桶', '馬桶蓋', '木門', '浴櫃門板', '面盆', '水龍頭', '暖風機', '遙控器', '加壓馬達', '漏水', '滿意度調查表', '返還通知函', '捷運局文件', '續租', '三方移轉', '租金管理費'],
  acts: ['現勘', '聯絡通知', '聯絡廠商、訂料', '安排時間', '修繕', '貼單通知', '投遞', '取回', '簽認', '文件整理', '照片整理、彙送', '巡檢', '電話催打、簡訊發送'],
  mates: ['德哥', '福興小胖', 'AMY']
};
const BETA = /log-beta/.test(location.pathname);
const KEY = BETA ? 'worklog-beta' : 'worklog-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
S = Object.assign({ conf: JSON.parse(JSON.stringify(DEF)), use: {}, entries: [], cases: [] }, S || {});
if (!Array.isArray(S.cases)) S.cases = [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠ 存不起來'); } };
// 站／社區：第一層。每個站可以有自己的棟號（第二層），沒有的就直接打地址
if (!Array.isArray(S.conf.sites) || !S.conf.sites.length) S.conf.sites = [{ name: S.conf.prefix || '新店機廠站', blds: ['153號', '161號'] }];
const siteOf = n => S.conf.sites.find(s => s.name === n) || S.conf.sites[0];
const siteNames = () => S.conf.sites.map(s => s.name);
const used = (k, v) => { S.use[k + '|' + v] = (S.use[k + '|' + v] || 0) + 1; };
const sorted = k => S.conf[k].slice().sort((a, b) => (S.use[k + '|' + b] || 0) - (S.use[k + '|' + a] || 0));

// 正在組的這一行
let B = blank();
function blank() { return { site: S.conf.lastSite && siteNames().includes(S.conf.lastSite) ? S.conf.lastSite : S.conf.sites[0].name, addr: '', cid: '', d: '', bld: '', fl: '', no: '', places: [], who: '', items: [], acts: [], mates: [], extra: '', edited: null, people: [] }; }
function placeNow() { if (!(siteOf(B.site).blds || []).length) return B.addr.trim(); if (!B.bld) return ''; return B.bld + (B.fl ? `${B.fl}樓` : '') + (B.fl && B.no ? `之${B.no}` : ''); }
function placesAll() { const p = placeNow(); return [...B.places, ...(p && !B.places.includes(p) ? [p] : [])]; }
// 整理一行：開頭重複的「新店機廠站新店機廠站」只留一個
function fixLine(s) { s = String(s || '').trim(); for (const P of siteNames()) if (P) while (s.startsWith(P + P)) s = s.slice(P.length); return s; }
function line() {
  if (B.edited != null) return B.edited;
  const parts = [placesAll().join('、'), B.who, B.items.join('、'), [B.acts.join('、'), B.extra].filter(Boolean).join('，')].filter(Boolean);
  if (!parts.length) return '';
  const P = B.site || '', body = parts.join('，').replace(P ? new RegExp('^(' + P.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')+[，、]?') : /^$/, '');
  // 棟號（153號…）直接接在站名後面；其他（管委會、某某社區的地址）中間加逗號
  const join = !P ? '' : /^[0-9０-９A-Za-z]/.test(body) ? '' : '，';
  return P + join + body + '_' + [S.conf.me, ...B.mates].join('、');
}

function chipRow(k, sel) {
  return `<div class="chips">${sorted(k).map(v => `<button class="chip ${sel.includes(v) ? 'on' : ''}" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}<button class="chip add" data-addk="${k}">＋ 其他</button></div>`;
}
// 分四步問：哪裡 → 什麼東西 → 做了什麼 → 看一下送出。每一步都可以跳過
let step = 0;
const STEPS = ['在哪裡？', '什麼東西？', '做了什麼？', '看一下，送出'];
function openComposer() { B = blank(); step = 0; $('builder').hidden = false; renderBuilder(); }
function closeComposer() { $('builder').hidden = true; }
function renderBuilder() {
  const L = line();
  let body = '';
  if (step === 0) { const site = siteOf(B.site), blds = site.blds || []; body = `
    <div class="hint">哪個站／社區</div>
    <div class="chips">${siteNames().map(n => `<button class="chip ${B.site === n ? 'on' : ''}" data-site="${esc(n)}" style="font-size:18px;padding:8px 16px">${esc(n)}</button>`).join('')}<button class="chip add" id="addSite">＋ 其他地方</button></div>
    ${blds.length ? `<div class="hint">哪一棟、幾樓</div>
    <div class="chips">${blds.map(b => `<button class="chip ${B.bld === b ? 'on' : ''}" data-bld="${esc(b)}" style="font-size:20px;padding:10px 22px">${esc(b)}</button>`).join('')}</div>
    <div class="row" style="font-size:18px"><input class="num" id="fl" inputmode="numeric" enterkeyhint="next" placeholder="樓" value="${esc(B.fl)}" style="width:80px;font-size:20px"><span>樓 之</span><input class="num" id="no" inputmode="numeric" enterkeyhint="next" placeholder="" value="${esc(B.no)}" style="width:80px;font-size:20px"></div>`
    : `<div class="hint">地址或戶號（可不填）</div><input id="addr" enterkeyhint="next" placeholder="例：A棟5樓、中正路100號" value="${esc(B.addr)}">`}
    <div><button class="sm" id="morePlace">＋ 同一行再加一戶</button></div>
    ${B.places.length ? `<div class="chips">${B.places.map((p, i) => `<button class="chip on" data-rmp="${i}">${esc(p)} ✕</button>`).join('')}</div>` : ''}
    <div class="hint">或是：</div>
    <div class="chips">${sorted('places').map(v => `<button class="chip ${B.places.includes(v) ? 'on' : ''}" data-plc="${esc(v)}">${esc(v)}</button>`).join('')}<button class="chip add" data-addk="places">＋ 其他</button></div>
    <div class="hint">對象（可不填）</div><input id="who" enterkeyhint="next" placeholder="例：陳小姐、某某公司、車位 B2-B016" value="${esc(B.who)}">`; }
  else if (step === 1) body = `<div class="hint">可以選好幾個</div>${chipRow('items', B.items)}`;
  else if (step === 2) body = `<div class="hint">可以選好幾個</div>${chipRow('acts', B.acts)}
    <div class="hint">補充（可不填）</div><input id="extra" enterkeyhint="next" placeholder="例：約5/18上午9:30" value="${esc(B.extra)}">`;
  else body = `
    ${B.cid ? `<div class="casechip">📁 加到案子：${esc((caseOf(B.cid) || {}).title || '')}</div>` : ''}
    <div class="row"><span class="hint">哪一天</span><input type="date" id="cD" value="${B.d || today()}" style="width:auto"><span class="hint">（之後要做的就選那天）</span></div>
    <div class="hint">一起的人（可不選）</div>${chipRow('mates', B.mates)}
    <div class="hint">這件事要聯絡的人（可不填，只存在這筆，不會寫進日曆）</div><div id="pplBox"></div>
    <div class="hint">這一行（可以直接改字）${B.edited != null ? ' <button class="link" id="unedit">照選的重組</button>' : ''}</div>
    <textarea class="prev big" id="prev" rows="3" style="min-height:96px" data-title="這一行">${esc(L)}</textarea><div class="tapedit">點一下會打開大字編輯</div>

// 匯入：備份檔（JSON）合併；或是日曆文字（日期一行、下面一行一筆）
function importText(txt, baseDay, cid, onCal = true) {
  const have = new Set(S.entries.map(e => e.d + '|' + e.text)); let n = 0, ord = cid ? nextOrd(cid) : 0;
  const add = x => { const k = x.d + '|' + x.text; if (!x.text || have.has(k)) return; have.add(k);
    if (cid && !x.cid) { x.cid = cid; x.ord = ord++; x.imp = false; } // 貼進案子的：當成這件案子的步驟
    S.entries.push(x); n++; };
  if (/^\s*\{/.test(txt)) {
    const j = JSON.parse(txt); if (!j.S || !Array.isArray(j.S.entries)) throw new Error('這不是工作日誌的備份檔');
    j.S.entries.forEach(add);
    (j.S.cases || []).forEach(c => { if (!S.cases.some(x => x.id === c.id)) S.cases.push(c); });
    (j.S.tpls || []).forEach(c => { if (!(S.tpls || []).some(x => x.name === c.name)) (S.tpls = S.tpls || []).push(c); });
    for (const k of ['places', 'items', 'acts', 'mates']) (j.S.conf && j.S.conf[k] || []).forEach(v => { if (!S.conf[k].includes(v)) S.conf[k].push(v); });
  } else {
    // 舊日曆文字是過去的紀錄：照原樣匯入（有 _OK 的算做完），但不放進首頁「還沒做完」，用篩選才找得到
    const now = new Date(); let d = null, lastAdded = null; const noDate = [];
    for (const raw of txt.split(/\r?\n/)) {
      const l = raw.trim(); if (!l) continue;
      // 日期的寫法：8/12、8/14（五）、0731、11月4日 星期三、2026年11月4日
      if (/^(全天|整天|上午|下午|中午|晚上)?\s*\d{0,2}[:：]?\d{0,2}\s*([–\-~～至到]\s*(上午|下午)?\s*\d{1,2}[:：]\d{2})?$/.test(l) || /^(全天|整天)$/.test(l)) continue; // 日曆複製時夾帶的時間，跳過
      const m = l.match(/^(\d{1,2})[\/／](\d{1,2})(?:\s*[（(].*[)）])?$/) || l.match(/^(\d{2})(\d{2})$/) || l.match(/^(?:\d{4}年)?(\d{1,2})月(\d{1,2})日(?:\s*(?:星期|週|\(|（).*)?$/);
      if (m) { let y = now.getFullYear(); if (+m[1] > now.getMonth() + 2) y--; d = `${y}-${pad(+m[1])}-${pad(+m[2])}`; noDate.splice(0).forEach(x => { x.d = d; add(x); }); continue; }
      const last = noDate.length ? noDate[noDate.length - 1] : lastAdded;
      if (last && /^[_＿，,、。]/.test(l)) { const tx = last.text + (last.ok ? '_OK' : '') + l; last.text = tx.replace(/[_＿]OK$/i, ''); last.ok = /[_＿]OK$/i.test(tx); continue; } // LINE 裡斷行的下半句，接回上一行
      const x = { id: uid(), d, tm: '', text: l.replace(/[_＿]OK$/i, ''), ok: /[_＿]OK$/i.test(l), cal: onCal, mail: false, imp: true };
      lastAdded = d ? x : null;
      if (d) add(x); else noDate.push(x); // 第一個日期之前的幾行，算在下一個日期
    }
    noDate.forEach(x => { x.d = baseDay || today(); add(x); });
    // 最近兩週的照常出現在首頁「還沒做完」；更早的才當成舊紀錄收起來
    S.entries.forEach(e => { if (e.imp && daysAgo(e.d) <= 14) e.imp = false; });
  }
  S.entries.sort((a, b) => (b.d + (b.tm || '')).localeCompare(a.d + (a.tm || '')));
  return n;
}

  $('cases').innerHTML = `<h2 style="display:flex;align-items:center"><span style="flex:1">📁 進行中的案子（${open.length}）</span><button class="link" id="bCase">＋ 開新案子</button></h2>
    <div style="display:flex;flex-direction:column;gap:8px">${open.map(caseCard).join('') || '<p class="hint">有好幾個步驟的事（例如退租點交、維修），可以開成一件案子，一步一步打勾。</p>'}</div>
    ${done.length ? `<details><summary>已完成的案子（${done.length}）</summary><div style="display:flex;flex-direction:column;gap:8px">${done.map(caseCard).join('')}</div></details>` : ''}`;
  $('bCase').onclick = () => newCaseSheet();

function upcomingHTML() {
  const up = S.entries.filter(e => !e.ok && e.d > today()).sort((a, b) => a.d.localeCompare(b.d));

let openCaseId = null;

  $('caseV').innerHTML = `<div class="top"><button class="pri backbtn" id="cvBack">← 回首頁</button><b style="flex:1;font-size:17px">📁 案子</b><b style="color:var(--accent)">${p.done}/${p.n}</b></div>
    <div class="body">
      <input id="cvT" value="${esc(c.title)}" style="font-size:20px;font-weight:900" placeholder="案子名稱，例：161號6樓之1 退租點交">

      <div class="hint">${caseDone(c) ? '✓ 這件案子全部做完了' : '每一步做完就打勾；全部打勾，這件案子就算完成。每一步可以各自放上日曆。'}</div>
      ${st.map(e => `<div class="stp ${e.ok ? 'done' : ''}"><button class="ck" data-sok="${e.id}">${e.ok ? '✓' : ''}</button>
        <div style="min-width:0;display:flex;flex-direction:column;gap:4px">

          <div style="word-break:break-all">${esc(full(e))}</div>
          <div class="row"><span style="flex:1"></span><button class="sm cal" data-cal="${e.id}">📅 上日曆</button><button class="sm" data-more="${e.id}">更多…</button></div></div></div>`).join('') || '<p class="hint">還沒有步驟。</p>'}
      <div class="row"><button class="pri" id="cvAdd" style="flex:2">＋ 加一步</button><button id="cvPaste" style="flex:1">📋 貼上</button></div>
      <div class="row"><button id="cvCopy" style="flex:1">⧉ 複製成新案子</button><button id="cvTpl" style="flex:1">⭐ 存成範本</button></div>

    </div>`;
  $('caseV').hidden = false;
  const box = $('caseV');
  $('cvBack').onclick = closeCase;
  $('cvT').onchange = () => { c.title = $('cvT').value.trim() || c.title; save(); renderList(); };
  box.querySelectorAll('[data-sok]').forEach(b => b.onclick = () => { const e = find(b.dataset.sok); e.ok = !e.ok; e.okAt = e.ok ? today() : ''; save(); renderList(); openCase(id); toast(e.ok ? (caseDone(c) ? '🎉 這件案子全部做完了' : '這一步做完了') : '已取消'); });
  box.querySelectorAll('[data-sd]').forEach(i => i.onchange = () => { const e = find(i.dataset.sd); if (i.value) { e.d = i.value; e.tm = ''; save(); renderList(); openCase(id); } });
  box.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => calSheet(find(b.dataset.cal)));
  box.querySelectorAll('[data-more]').forEach(b => b.onclick = () => moreSheet(find(b.dataset.more)));
  $('cvAdd').onclick = () => { B = blank(); B.cid = c.id; if (c.place) B.places = [c.place]; step = 0; $('builder').hidden = false; renderBuilder(); };
  $('cvCopy').onclick = () => newCaseSheet({ fromCase: c });
  $('cvPaste').onclick = pasteSheet;
  $('cvTpl').onclick = () => saveTplSheet(c);
  $('cvDel').onclick = () => { const b = $('cvDel'); if (!b.dataset.s) { b.dataset.s = 1; b.textContent = `再按一次：刪掉這件案子和 ${st.length} 個步驟`; return; }
    S.entries = S.entries.filter(e => e.cid !== c.id); S.cases = S.cases.filter(x => x !== c); save(); closeCase(); toast('已刪除整件案子（日曆上的不會動）'); };
}
function closeCase() { $('caseV').hidden = true; openCaseId = null; renderList(); }
const PLACE_TOKEN = '{地點}';
// 開新案子：空白、從範本、或複製一件舊案子（複製出來的是獨立的一份，不會互相同步）
function newCaseSheet(opt = {}) {
  const src = opt.fromCase || null;
  let tplId = '';
  const stepsFrom = () => {
    if (src) return stepsOf(src).map(e => src.place ? e.text.split(src.place).join(PLACE_TOKEN) : e.text);
    const tp = S.tpls.find(x => x.id === tplId); return tp ? tp.steps.slice() : [];
  };
  openSheet(`<h3 style="margin:0">${src ? '⧉ 複製成新案子' : '📁 開新案子'}</h3>
    ${src ? `<div class="hint">從「${esc(src.title)}」複製 ${stepsOf(src).length} 個步驟，地點換成新的；複製出來的是獨立的一份，改這件不會影響原本那件。</div>` :
      `<div class="lbl">用範本（可不選）</div><div class="chips" id="ncT"><button class="chip on" data-tp="">不用範本</button>${S.tpls.map(x => `<button class="chip" data-tp="${x.id}">${esc(x.name)}</button>`).join('')}</div>`}
    <div class="lbl">地點</div><input id="ncP" placeholder="例：161號6樓之1" value="">
    <div class="lbl">案子名稱</div><input id="ncN" placeholder="例：161號6樓之1 退租點交" value="${src ? esc(src.title.split(src.place || '\u0000').join('')) : ''}">
    <div class="hint" id="ncPrev"></div>
    <div class="row" style="justify-content:flex-end"><button onclick="closeSheet()">取消</button><button class="pri" id="ncOk">建立</button></div>`);
  const prev = () => { const pl = $('ncP').value.trim(), s = stepsFrom();
    $('ncPrev').innerHTML = s.length ? `會帶出 ${s.length} 個步驟（日期都先放今天，之後在案子裡改）：<br>` + s.map(x => '・' + esc(x.split(PLACE_TOKEN).join(pl || '（地點）'))).join('<br>') : '空白的案子，建立後再一步一步加。'; };
  const autoName = () => { const tp = S.tpls.find(x => x.id === tplId), pl = $('ncP').value.trim();
    if (src) { $('ncN').value = (src.place ? src.title.split(src.place).join(pl) : src.title); } else if (tp && !$('ncN').dataset.typed) $('ncN').value = tp.title.split(PLACE_TOKEN).join(pl).trim(); };
  if ($('ncT')) $('ncT').querySelectorAll('[data-tp]').forEach(b => b.onclick = () => { tplId = b.dataset.tp; $('ncT').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); autoName(); prev(); });
  $('ncP').oninput = () => { autoName(); prev(); };
  $('ncN').oninput = () => { $('ncN').dataset.typed = 1; };
  prev();
  $('ncOk').onclick = () => {
    const pl = $('ncP').value.trim(), name = $('ncN').value.trim() || (pl ? pl + ' 案子' : '');
    if (!name) return toast('請寫案子名稱或地點');
    const c = { id: uid(), title: name, place: pl, created: today() }; S.cases.unshift(c);
    stepsFrom().forEach((x, i) => S.entries.unshift({ id: uid(), cid: c.id, ord: i + 1, d: today(), tm: '', text: fixLine(x.split(PLACE_TOKEN).join(pl)), ok: false, cal: false, mail: false, people: [] }));
    save(); closeSheet(); renderList(); openCase(c.id); toast('案子建好了');
  };
}
function saveTplSheet(c) {
  const st = stepsOf(c);
  openSheet(`<h3 style="margin:0">⭐ 存成範本</h3>
    <div class="hint">把這件案子的 ${st.length} 個步驟存起來，下次「開新案子」選這個範本，換個地點就好。${c.place ? `步驟裡的「${esc(c.place)}」會換成新的地點。` : ''}</div>
    <div class="lbl">範本名稱</div><input id="tpN" value="${esc(c.title.split(c.place || '\u0000').join('').trim() || c.title)}">
    <div class="row" style="justify-content:flex-end"><button onclick="closeSheet()">取消</button><button class="pri" id="tpOk">存起來</button></div>`);
  $('tpOk').onclick = () => { const n = $('tpN').value.trim(); if (!n) return toast('請寫範本名稱');
    const tok = s => c.place ? s.split(c.place).join(PLACE_TOKEN) : s;
    S.tpls = S.tpls.filter(x => x.name !== n); S.tpls.push({ id: uid(), name: n, title: tok(c.title), steps: st.map(e => tok(e.text)) });
    save(); closeSheet(); toast('已存成範本「' + n + '」'); };
}
// 把一行放進某件案子（回溯：之後從這一行就能點回案子）
function pickCaseSheet(e) {
  openSheet(`<h3 style="margin:0">📁 放進哪件案子？</h3>
    <div style="display:flex;flex-direction:column;gap:8px">${S.cases.filter(c => !caseDone(c)).map(c => `<button data-pc="${c.id}" style="text-align:left">${esc(c.title)}　<span class="hint">${prog(c).done}/${prog(c).n}</span></button>`).join('') || '<p class="hint">還沒有進行中的案子。</p>'}</div>
    <div class="row"><button id="pcNew" style="flex:1">＋ 用這一行開一件新案子</button>${e.cid ? '<button id="pcOut" style="flex:1">移出案子</button>' : ''}</div>
    <div class="row" style="justify-content:flex-end"><button onclick="closeSheet()">取消</button></div>`);
  document.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => { e.cid = b.dataset.pc; e.ord = nextOrd(e.cid); save(); closeSheet(); renderList(); toast('已放進案子'); });
  $('pcNew').onclick = () => { const f = fieldsOf(e), c = { id: uid(), title: (f.place ? f.place + ' ' : '') + (f.items || f.acts || '案子').split(/[，、]/)[0], place: f.place || '', created: today() };
    S.cases.unshift(c); e.cid = c.id; save(); closeSheet(); renderList(); openCase(c.id); toast('案子建好了，名稱可以點上面改'); };
  if ($('pcOut')) $('pcOut').onclick = () => { delete e.cid; save(); closeSheet(); renderList(); toast('已移出案子'); };
}
function openSheet(h) { $('box').innerHTML = h; $('sheet').hidden = false; }
function closeSheet() { $('sheet').hidden = true; }
// 大字編輯：點小的文字框，整個畫面變成一個大字的編輯區（鍵盤打開也還看得清楚），按「好了」帶回去
let beSrc = null;
document.addEventListener('focusin', ev => {
  const ta = ev.target; if (!(ta instanceof HTMLTextAreaElement) || !ta.classList.contains('big') || ta.id === 'beTa') return;
  beSrc = ta; ta.blur();
  $('beT').textContent = ta.dataset.title || '編輯'; $('beTa').value = ta.value; $('beTa').placeholder = ta.placeholder || '';
  $('bigEd').hidden = false; const b = $('beTa'); b.focus(); try { b.setSelectionRange(b.value.length, b.value.length); } catch (e) {}
});
$('beOk').onclick = () => { if (beSrc) { beSrc.value = $('beTa').value; beSrc.dispatchEvent(new Event('input', { bubbles: true })); } $('bigEd').hidden = true; beSrc = null; };
$('beX').onclick = () => { $('bigEd').hidden = true; beSrc = null; };
// 字的大小（設定裡選）：整頁放大
function applyZoom() { document.documentElement.style.zoom = String(S.conf.zoom || 1); }
// 點灰色背景才關：按下和放開都要在背景上。選取文字時手指拖到框外放開，不算
let downOnBack = false;
$('sheet').addEventListener('pointerdown', ev => { downOnBack = ev.target.id === 'sheet'; });
$('sheet').onclick = ev => { if (ev.target.id === 'sheet' && downOnBack) closeSheet(); downOnBack = false; };
$('bSet').onclick = () => setSheet();
$('bNew').onclick = openComposer;
$('bPaste').onclick = pasteSheet;
/* ============ 操作教學：第一次打開時，一步一步框出畫面上的東西 ============ */
const TOUR = [
  { el: '#bNew', t: '＋ 記一筆', p: '做完一件事就按這裡。點地點、點東西、點做了什麼，就會組出日曆要的那一行，不用打字。' },
  { el: '#bPaste', t: '📋 貼上', p: '在 LINE 或日曆「複製」了一段文字，按這裡就會自動放進來，一行變一筆。' },
  { el: '#bCase2', t: '📁 開案子', p: '有好幾個步驟的事（例如退租點交、維修）開成一件案子，一步一步打勾，看得到做到哪裡。' },
  { el: '#dash .tiles', t: '三個數字', p: '還沒做完幾筆、今天記了幾筆、這週做完幾筆。點數字可以直接列出那些紀錄。' },
  { el: '#tools', t: '🔍 搜尋、匯出、刪除', p: '要找某一戶、某件事，或是匯出 Excel、一次刪很多筆，點這一行打開。' },
  { el: '#pending h2, #cases h2', t: '要追的事', p: '⚠ 之前還沒做完的會排在最前面，超過 7 天會變紅。下面是進行中的案子和進度。' },
  { el: '#days .entry, #pending .entry', t: '每一筆紀錄', p: '做完按「✓ 做完了」，後面會加上 _OK。按「更多…」可以上日曆、寄信箱、改字、放進案子。' },
  { el: '#again h2', t: '⭐ 常用', p: '常做的事放這裡，點一下就帶入，改一改就送出。' },
  { el: '#bSet', t: '⚙ 設定', p: '字太小可以在這裡放大；也可以管理按鈕選項、常用，下載備份。想再看這個教學，也在這裡。' }
];
const TOUR_KEY = (BETA ? 'worklog-beta' : 'worklog') + '-tour-done';
let tourI = 0, tourList = [];
/* ============ 手機的「返回」：先關掉最上面的畫面，不會直接離開工作日誌 ============ */
let guard = false;
function ensureGuard() { if (!guard) { try { history.pushState({ wl: 1 }, ''); guard = true; } catch (e) {} } }
const anyOpen = () => ['tour', 'bigEd', 'sheet', 'builder', 'caseV'].some(id => !$(id).hidden);
new MutationObserver(() => { if (anyOpen()) ensureGuard(); }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
addEventListener('popstate', () => {
  guard = false;
  if (!$('tour').hidden) endTour();
  else if (!$('bigEd').hidden) $('beX').click();
  else if (!$('sheet').hidden) closeSheet();
  else if (!$('builder').hidden) { if (step > 0) { step--; renderBuilder(); } else closeComposer(); }
  else if (!$('caseV').hidden) closeCase();
  if (anyOpen()) ensureGuard();
});
function startTour() {
  tourList = TOUR.filter(s => document.querySelector(s.el)); if (!tourList.length) return;
  tourI = 0; $('tour').hidden = false; showTour();
}
function endTour() { $('tour').hidden = true; try { localStorage.setItem(TOUR_KEY, '1'); } catch (e) {} }
function showTour() {
  const s = tourList[tourI], el = document.querySelector(s.el); if (!el) return endTour();
  el.scrollIntoView({ block: 'center' });
  setTimeout(() => {
    const r = el.getBoundingClientRect(), pad = 6, H = innerHeight, hole = $('tourHole'), tip = $('tourTip');
    Object.assign(hole.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
    const last = tourI === tourList.length - 1;
    tip.innerHTML = `<div class="dots">${tourList.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('')}</div><h4>${s.t}</h4><p>${s.p}</p>
      <div class="row"><button id="tSkip">跳過教學</button><span style="flex:1"></span>${tourI ? '<button id="tPrev">← 上一步</button>' : ''}<button class="pri" id="tNext">${last ? '開始使用' : '下一步 →'}</button></div>`;
    // 框在下半部，說明放上面；框在上半部，說明放下面
    const below = r.top + r.height / 2 < H / 2;
    tip.style.top = below ? Math.min(H - 260, r.bottom + pad + 14) + 'px' : 'auto';
    tip.style.bottom = below ? 'auto' : Math.max(12, H - r.top + pad + 14) + 'px';
    $('tSkip').onclick = endTour;
    if ($('tPrev')) $('tPrev').onclick = () => { tourI--; showTour(); };
    $('tNext').onclick = () => { if (last) return endTour(); tourI++; showTour(); };
  }, 120);
}
addEventListener('resize', () => { if (!$('tour').hidden) showTour(); });
$('bCase2').onclick = () => newCaseSheet();
setTimeout(() => { let done = false; try { done = !!localStorage.getItem(TOUR_KEY); } catch (e) {} if (!done) startTour(); }, 400);
if (BETA) document.querySelector('header h1').insertAdjacentHTML('afterend', '<span class="badge" style="font-size:13px">試用版</span>');
// 以前記的「新店機廠站新店機廠站…」整理成一個
S.entries.forEach(e => { const f = fixLine(e.text); if (f !== e.text) { e.text = f; save(); } });
applyZoom();
$('selCancel').onclick = () => { selMode = false; picked.clear(); renderList(); };
$('selDel').onclick = () => {
  const b = $('selDel');
  if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = `再按一次，刪除 ${picked.size} 筆`; return; }
  const n = picked.size; S.entries = S.entries.filter(e => !picked.has(e.id)); save(); selMode = false; picked.clear(); renderList(); toast(`已刪除 ${n} 筆（日曆、信箱上的不會動）`);
};
renderList();
if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
